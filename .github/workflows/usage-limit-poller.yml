name: usage-limit poller
on:
  # Primary heartbeat: the Cloudflare Worker's Cron Trigger (worker/wrangler.toml)
  # POSTs this every 5 minutes via repository_dispatch, since it's far more
  # reliable than GH Actions' own `schedule` trigger below (see #105).
  repository_dispatch:
    types: [poller_tick]
  schedule:
    # Fallback heartbeat, kept in case the Cloudflare side ever misfires.
    # Every 15 minutes. The poller only re-fires entries whose retry_after
    # has actually passed (scripts/poll-pending-retries.js) — this cadence
    # just bounds how late a resume can be, not how often anything happens.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      # pending-retries.json now persists to the-intern-data via a separately
      # minted installation token (issue #112), not this job's own GITHUB_TOKEN.
      # actions: write creates the workflow_dispatch/repository_dispatch re-fire.
      contents: read
      actions: write
    # Serialized so two overlapping runs (a slow run plus the next schedule
    # tick) can't both read the same due entry and double-fire it before
    # either has a chance to push the post-fire lock (see markFired in
    # scripts/pending-retries-store.js).
    concurrency:
      group: usage-limit-poller
      cancel-in-progress: false
    steps:
      - name: Checkout agent-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Re-fire due retries
        run: node scripts/poll-pending-retries.js
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          RETRY_LOCK_MINUTES: 25
          # Lets manage-pending-retries.js mint its own the-intern-data token
          # (issue #112) — pending-retries.json now lives solely on the-intern-data.
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  notify-failure:
    needs: poll
    if: always() && needs.poll.result == 'failure'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout agent-infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Notify maintainer via Telegram
        run: node scripts/notify-failure.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: usage-limit poller
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: poll
