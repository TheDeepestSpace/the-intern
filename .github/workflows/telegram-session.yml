name: telegram session
on:
  repository_dispatch:
    types: [telegram_message]

permissions:
  contents: write

jobs:
  respond:
    runs-on: ubuntu-latest
    # codex-backend runs need global serialization across the whole repo (not just
    # per-chat): codex proactively rotates its own refresh token in place, and
    # rotated refresh tokens are typically single-use, so an overlapping codex run
    # from here and from dispatcher.yml restoring/persisting CODEX_AUTH_JSON at once
    # would race and strand each other on a stale token. `steps.*` outputs aren't
    # available yet when this group is resolved, so the backend keyword is matched
    # straight out of the raw event text.
    concurrency:
      group: ${{ contains(github.event.client_payload.text, 'backend=codex') && 'the-intern-codex-auth' || format('telegram-{0}', github.event.client_payload.chat_id) }}
      cancel-in-progress: false
      queue: max
    container:
      image: ghcr.io/thedeepestspace/the-intern-dev:latest
      options: --user root
    env:
      CODEX_HOME: /home/dev/.codex
    steps:
      - name: Checkout agent-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Parse backend from Telegram message
        id: parse
        run: node scripts/parse-telegram-trigger.js

      - name: Mint installation token
        id: token
        run: node scripts/mint-installation-token.js
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPO: ${{ github.repository }}

      # Transitional (issue #112): mirrors conversation state onto the-intern-data
      # alongside this repo's own telegram branch. continue-on-error since repo
      # access for the App may not be granted yet — every step below that depends
      # on this one is gated on its token output being non-empty, so a failure
      # here just falls back to the existing the-intern-only behavior.
      - name: Mint installation token for the-intern-data
        id: data_token
        continue-on-error: true
        run: node scripts/mint-installation-token.js
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          TARGET_REPO: TheDeepestSpace/the-intern-data

      - name: Checkout telegram branch (create if missing)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          REPO_URL="https://github.com/${{ github.repository }}.git"
          git config --global user.name "the-intern-bot[bot]"
          git config --global user.email "the-intern-bot[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$GH_TOKEN"; }; f'

          rm -rf tg-state
          if git clone --branch telegram --single-branch "$REPO_URL" tg-state 2>/dev/null; then
            echo "Cloned existing telegram branch."
          else
            echo "Creating orphan telegram branch..."
            git clone "$REPO_URL" tg-state
            cd tg-state
            git checkout --orphan telegram
            git rm -rf . 2>/dev/null || true
            echo "# Telegram bot state — conversation continuity" > README.md
            echo "# Ongoing Telegram Conversation Summary" > convo.md
            git add README.md convo.md
            git commit -m "init telegram branch"
            git push origin telegram
            cd ..
          fi

      # Same shape as the step above, targeting the-intern-data's own `telegram`
      # branch instead of an orphan branch on this repo (see manage-summaries.js
      # for the equivalent split for session summaries).
      - name: Checkout telegram branch on the-intern-data (create if missing)
        id: data_checkout
        if: steps.data_token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.data_token.outputs.token }}
        run: |
          REPO_URL="https://github.com/TheDeepestSpace/the-intern-data.git"

          rm -rf tg-data-state
          if git clone --branch telegram --single-branch "$REPO_URL" tg-data-state 2>/dev/null; then
            echo "Cloned existing telegram branch on the-intern-data."
          else
            echo "Creating telegram branch on the-intern-data..."
            git clone "$REPO_URL" tg-data-state
            cd tg-data-state
            git checkout --orphan telegram
            git rm -rf . 2>/dev/null || true
            echo "# Telegram bot state — conversation continuity" > README.md
            echo "# Ongoing Telegram Conversation Summary" > convo.md
            git add README.md convo.md
            git commit -m "init telegram branch"
            git push origin telegram
            cd ..
          fi

      - name: Install script dependencies for Codex auth round-trip
        if: steps.parse.outputs.backend == 'codex'
        run: npm ci --omit=dev --include=prod --no-audit --no-fund

      # See dispatcher.yml's matching step for the full rationale — same
      # personal-account Codex login round-trip, just triggered from Telegram
      # instead of a GH comment.
      - name: Restore Codex auth.json from secret
        if: steps.parse.outputs.backend == 'codex'
        run: node scripts/rotate-codex-auth.js restore || echo "::warning::Codex auth.json restore failed; codex exec will fail without valid credentials"
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}

      - name: Run agent (fresh session with convo.md context)
        working-directory: tg-state
        env:
          BACKEND: ${{ steps.parse.outputs.backend }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ steps.parse.outputs.backend != 'codex' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
          CLEAN_TEXT: ${{ steps.parse.outputs.clean_text }}
          RETRY_SOURCE: telegram
          WORKFLOW_FILE: telegram-session.yml
          DISPATCH_REF: ${{ github.ref_name }}
          MAX_RETRIES: 3
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          export MESSAGE="$CLEAN_TEXT"
          export CHAT_ID="$(jq -r '.client_payload.chat_id // empty' "$GITHUB_EVENT_PATH")"
          export REPLY_TO_MESSAGE_ID="$(jq -r '.client_payload.message_id // empty' "$GITHUB_EVENT_PATH")"
          export PHOTO_FILE_ID="$(jq -r '.client_payload.photo_file_id // empty' "$GITHUB_EVENT_PATH")"
          export REPLY_CONTEXT_MESSAGE_ID="$(jq -r '.client_payload.reply_to_message_id // empty' "$GITHUB_EVENT_PATH")"
          export REPLY_CONTEXT_TEXT="$(jq -r '.client_payload.reply_to_text // empty' "$GITHUB_EVENT_PATH")"
          export REPLY_PHOTO_FILE_ID="$(jq -r '.client_payload.reply_to_photo_file_id // empty' "$GITHUB_EVENT_PATH")"

          PHOTO_PATH=""
          if [ -n "$PHOTO_FILE_ID" ]; then
            PHOTO_PATH="telegram_photo.jpg"
            node ../scripts/download-telegram-photo.js "$PHOTO_PATH"
          fi
          export PHOTO_PATH

          REPLY_PHOTO_PATH=""
          if [ -n "$REPLY_PHOTO_FILE_ID" ]; then
            REPLY_PHOTO_PATH="telegram_reply_photo.jpg"
            PHOTO_FILE_ID="$REPLY_PHOTO_FILE_ID" node ../scripts/download-telegram-photo.js "$REPLY_PHOTO_PATH"
          fi
          export REPLY_PHOTO_PATH

          node -e '
            const fs = require("fs");
            let instructions = "";
            try {
              instructions = fs.readFileSync("../instructions/telegram.md", "utf8");
            } catch (err) {
              if (err.code !== "ENOENT") throw err;
            }

            let style = "";
            try {
              style = fs.readFileSync("../instructions/shared-style.md", "utf8");
            } catch (err) {
              if (err.code !== "ENOENT") throw err;
            }

            // Reads convo.md from a clone dir plus its last-touched commit time, so
            // the two sources below (the telegram branch on this repo, and on
            // the-intern-data, see issue #112) can be compared and the more
            // recently updated one used — context should never look "lost" mid cutover.
            function readConvo(dir) {
              const { execSync } = require("child_process");
              let content = "";
              let mtime = 0;
              try {
                const buffer = fs.readFileSync(`${dir}/convo.md`);
                const MAX_CONVO_BYTES = 20 * 1024;
                if (buffer.length > MAX_CONVO_BYTES) {
                  const start = buffer.length - MAX_CONVO_BYTES;
                  let contentStart = start;
                  if (start > 0 && buffer[start - 1] !== 0x0a) {
                    const firstNewline = buffer.indexOf(0x0a, start);
                    contentStart = firstNewline === -1 ? buffer.length : firstNewline + 1;
                  }
                  content = buffer.subarray(contentStart).toString("utf8");
                } else {
                  content = buffer.toString("utf8");
                }
                try {
                  mtime = Number(execSync(`git -C ${dir} log -1 --format=%ct -- convo.md`, { encoding: "utf8" }).trim()) || 0;
                } catch (err) {
                  mtime = 0;
                }
              } catch (err) {
                if (err.code !== "ENOENT") throw err;
              }
              return { content, mtime };
            }

            const primaryConvo = readConvo(".");
            const dataRepoConvo = readConvo("../tg-data-state");
            const convo = dataRepoConvo.mtime > primaryConvo.mtime && dataRepoConvo.content
              ? dataRepoConvo.content
              : primaryConvo.content;

            // Write the selected (newer) source back to tg-state/convo.md so the
            // on-disk file the agent reads/updates and the prompt context agree —
            // otherwise the agent could append to a stale primaryConvo while the
            // prompt above it shows the newer dataRepoConvo, and the later mirror
            // step would push that stale file back over the newer copy.
            if (convo) {
              fs.writeFileSync("convo.md", convo);
            }

            const msg = process.env.MESSAGE || "";
            const photoPath = process.env.PHOTO_PATH || "";
            const photoNote = photoPath ? `\n\nAn image was attached: ${photoPath}` : "";
            const replyToMessageId = process.env.REPLY_CONTEXT_MESSAGE_ID || "";
            const replyToText = process.env.REPLY_CONTEXT_TEXT || "";
            const replyPhotoPath = process.env.REPLY_PHOTO_PATH || "";
            let replyNote = "";
            if (replyToMessageId) {
              const textPart = replyToText ? `: "${replyToText}"` : "";
              const photoPart = replyPhotoPath ? ` (photo attached: ${replyPhotoPath})` : "";
              replyNote = `\n\nThis message is a reply to Telegram message ${replyToMessageId}${textPart}${photoPart}`;
            }
            const prompt = `${instructions}\n\n${style}\n\nPrior Conversation Summary (from convo.md):\n${convo}\n\nNew Telegram Message:\n${msg}${replyNote}${photoNote}`;
            fs.writeFileSync("/tmp/prompt.txt", prompt);
          '

          # codex exec has no --output-format json like claude; instead it streams
          # JSONL events to stdout (captured separately, for debugging only) and
          # writes the final agent message to --output-last-message. This wraps
          # that final message into the same {result, is_error} shape claude's
          # own --output-format json produces, mirroring dispatcher.yml's
          # normalize-codex-result.js.
          node -e '
            const fs = require("fs");
            const lines = [
              "const fs = require(\"fs\");",
              "const exitCode = process.argv[2];",
              "let finalMessage = \"\";",
              "try { finalMessage = fs.readFileSync(\"/tmp/codex-final.txt\", \"utf8\"); } catch (e) {}",
              "const isError = exitCode !== \"0\" || !finalMessage.trim();",
              "fs.writeFileSync(\"/tmp/result.json\", JSON.stringify({ result: finalMessage, is_error: isError }, null, 2));",
            ];
            fs.writeFileSync("/tmp/normalize-codex-result.js", lines.join("\n"));
          '

          id -u dev >/dev/null 2>&1 || (useradd -m -s /bin/bash dev && echo '%sudo ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers)
          chown -R dev:dev . /home/dev /tmp/prompt.txt /tmp/normalize-codex-result.js 2>/dev/null || true
          su dev -c '
            export CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN"
            export TG_BOT_TOKEN="$TG_BOT_TOKEN"
            export CHAT_ID="$CHAT_ID"
            export REPLY_TO_MESSAGE_ID="$REPLY_TO_MESSAGE_ID"
            export GH_TOKEN="$GH_TOKEN"
            export GITHUB_TOKEN="$GITHUB_TOKEN"
            export BACKEND="$BACKEND"
            export HOME="/home/dev"
            cd "$(pwd)"

            PROMPT="$(cat /tmp/prompt.txt)"
            if [ "$BACKEND" = "codex" ]; then
              codex exec --dangerously-bypass-approvals-and-sandbox --json --output-last-message /tmp/codex-final.txt "$PROMPT" > /tmp/codex-events.jsonl 2>&1
              CODEX_EXIT=$?
              node /tmp/normalize-codex-result.js "$CODEX_EXIT" || true
              cp /tmp/result.json result.json 2>/dev/null || true
            else
              claude -p "$PROMPT" --output-format json --dangerously-skip-permissions 2>&1 | tee result.json || true
            fi
          '

          # See dispatcher.yml's matching step: detects a Claude usage-limit stall
          # (issue #100) and queues a pending-retries.json entry instead of leaving
          # this conversation silently stuck, or clears/pings on resume.
          if [ -z "$CHAT_ID" ]; then
            echo "::warning::CHAT_ID is empty; skipping usage-limit retry handling to avoid a shared RETRY_KEY."
          else
            RESULT_FILE=result.json RETRY_KEY="telegram:${CHAT_ID}" RETRY_CHAT_ID="$CHAT_ID" \
              node "$GITHUB_WORKSPACE/scripts/handle-agent-outcome.js"
          fi

      # Runs even if the step above failed — see dispatcher.yml's matching step for
      # why a mid-run failure can still leave a rotated, single-use refresh token
      # on disk that needs writing back regardless of outcome.
      - name: Persist refreshed Codex auth.json to secret
        if: always() && steps.parse.outputs.backend == 'codex'
        run: node scripts/rotate-codex-auth.js persist
        env:
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}

      - name: Commit updated convo.md to telegram branch
        working-directory: tg-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "the-intern-bot[bot]"
          git config user.email "the-intern-bot[bot]@users.noreply.github.com"
          git add convo.md || true
          git commit -m "telegram: update convo.md $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin telegram

      # Mirrors the same convo.md onto the-intern-data. Best-effort: skipped
      # entirely if the earlier token mint failed (repo access not yet granted,
      # see issue #112), and continue-on-error so a push race or other failure
      # here never fails the job — the-intern's own telegram branch above
      # remains the source of truth during the transition.
      - name: Commit updated convo.md to telegram branch on the-intern-data
        if: steps.data_token.outputs.token != '' && steps.data_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: tg-data-state
        env:
          GH_TOKEN: ${{ steps.data_token.outputs.token }}
        run: |
          cp ../tg-state/convo.md convo.md
          git config user.name "the-intern-bot[bot]"
          git config user.email "the-intern-bot[bot]@users.noreply.github.com"
          git add convo.md || true
          git commit -m "telegram: update convo.md $(date -u +%FT%TZ)" || echo "nothing to commit"
          git push origin telegram

  notify-failure:
    needs: respond
    if: always() && needs.respond.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent-infra
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Notify maintainer via Telegram
        run: node scripts/notify-failure.js
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: telegram session
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED_JOBS: respond
