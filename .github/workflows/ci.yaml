name: CI

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
  pull_request:
    paths:
      - 'worker/**'

permissions:
  contents: read

jobs:
  worker-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
