name: Audit worker dependencies

on:
  push:
    branches: [main]
    paths:
      - 'worker/package.json'
      - 'worker/package-lock.json'
  pull_request:
    paths:
      - 'worker/package.json'
      - 'worker/package-lock.json'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=high
