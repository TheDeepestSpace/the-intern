name: Trigger CodeRabbit for bot PRs

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions: {}

jobs:
  trigger-review:
    # Dependabot-triggered runs never receive repository secrets (only a
    # read-only GITHUB_TOKEN), so CODERABBIT_TRIGGER_PAT wouldn't be
    # available even if we let it through here.
    if: |
      github.event.pull_request.user.type == 'Bot' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    concurrency:
      group: trigger-coderabbit-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Give CodeRabbit a moment to ingest the PR
        run: sleep 20

      - name: Request full review
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.CODERABBIT_TRIGGER_PAT }}
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const alreadyTriggered = comments.some(
              (comment) => comment.body.trim() === '@coderabbitai full review'
            );
            if (alreadyTriggered) {
              console.log('Review already requested for this PR, skipping.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@coderabbitai full review'
            });
