name: Trigger CodeRabbit for bot PRs

on:
  pull_request_target:
    types: [opened, ready_for_review]

permissions:
  contents: read

jobs:
  trigger-review:
    if: github.event.pull_request.user.type == 'Bot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Give CodeRabbit a moment to ingest the PR
        run: sleep 20

      - name: Request full review
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          github-token: ${{ secrets.CODERABBIT_TRIGGER_PAT }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '@coderabbitai full review'
            });
