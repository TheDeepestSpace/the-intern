name: the-intern-bot dispatcher
on:
  repository_dispatch:
    types: [issue_comment, pull_request_review, pull_request_review_comment]
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Target repository (owner/repo)'
        required: true
      pr_number:
        description: 'Issue or PR number'
        required: true
      comment_body:
        description: 'Comment or instruction body'
        required: true
      installation_id:
        description: 'GitHub App Installation ID (optional)'
        required: false

jobs:
  detect-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.check.outputs.image }}
      target_repo: ${{ steps.parse.outputs.target_repo }}
      issue_number: ${{ steps.parse.outputs.issue_number }}
      clean_prompt: ${{ steps.parse.outputs.clean_prompt }}
      installation_id: ${{ steps.parse.outputs.installation_id }}
    steps:
      - name: Checkout agent-infra
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse trigger and extract target repo / params
        id: parse
        run: node scripts/parse-trigger.js
        env:
          INPUT_TARGET_REPO: ${{ github.event.inputs.target_repo }}
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          INPUT_COMMENT_BODY: ${{ github.event.inputs.comment_body }}
          INPUT_INSTALLATION_ID: ${{ github.event.inputs.installation_id }}

      - name: Mint temporary token for image check
        id: temp_token
        run: node scripts/mint-installation-token.js
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ steps.parse.outputs.installation_id }}
          TARGET_REPO: ${{ steps.parse.outputs.target_repo }}

      - name: Check for repo-specific devcontainer image on GHCR
        id: check
        env:
          GH_TOKEN: ${{ steps.temp_token.outputs.token }}
        run: |
          FALLBACK_IMAGE="ghcr.io/thedeepestspace/the-intern-dev:latest"
          REPO_NAME="${{ steps.parse.outputs.target_repo }}"
          if [ -z "$REPO_NAME" ]; then
            echo "image=$FALLBACK_IMAGE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REPO_OWNER="${REPO_NAME%%/*}"
          REPO_SLUG="${REPO_NAME##*/}"
          IMAGE="ghcr.io/${REPO_OWNER,,}/${REPO_SLUG,,}-dev"
          SCOPE="repository:${REPO_OWNER,,}/${REPO_SLUG,,}-dev:pull"
          GHCR_TOKEN=$(curl -s -u "token:${GH_TOKEN}" \
               "https://ghcr.io/token?service=ghcr.io&scope=${SCOPE}" | jq -r '.token // empty')

          TAGS=""
          if [ -n "$GHCR_TOKEN" ]; then
            TAGS=$(curl -s -f -H "Authorization: Bearer $GHCR_TOKEN" \
                 "https://ghcr.io/v2/${REPO_OWNER,,}/${REPO_SLUG,,}-dev/tags/list" || true)
          fi

          TAG=""
          if [ -n "$TAGS" ] && echo "$TAGS" | jq -e 'has("tags")' > /dev/null 2>&1; then
            if echo "$TAGS" | jq -e '.tags | index("dev-latest")' > /dev/null; then
              TAG="dev-latest"
            elif echo "$TAGS" | jq -e '.tags | index("latest")' > /dev/null; then
              TAG="latest"
            fi
          fi

          if [ -n "$TAG" ]; then
            echo "Detected custom container image: $IMAGE:$TAG"
            echo "image=$IMAGE:$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "No repo-specific container image found; using fallback $FALLBACK_IMAGE"
            echo "image=$FALLBACK_IMAGE" >> "$GITHUB_OUTPUT"
          fi

  handle:
    needs: detect-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.detect-image.outputs.image }}
      options: --user root
    steps:
      - name: Checkout agent-infra
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mint installation token
        id: token
        run: node scripts/mint-installation-token.js
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ needs.detect-image.outputs.installation_id }}
          TARGET_REPO: ${{ needs.detect-image.outputs.target_repo }}

      - name: Checkout target repository
        if: needs.detect-image.outputs.target_repo != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.detect-image.outputs.target_repo }}
          token: ${{ steps.token.outputs.token }}
          path: target

      - name: Fetch prior session summary context
        id: summary_context
        run: node scripts/manage-summaries.js fetch
        env:
          TARGET_REPO: ${{ needs.detect-image.outputs.target_repo }}
          ISSUE_NUMBER: ${{ needs.detect-image.outputs.issue_number }}

      - name: Run Claude (fresh session per trigger, as non-root user)
        if: needs.detect-image.outputs.target_repo != ''
        working-directory: target
        run: |
          export CLAUDE_CODE_OAUTH_TOKEN="${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}"
          export GH_TOKEN="${{ steps.token.outputs.token }}"
          export GITHUB_TOKEN="${{ steps.token.outputs.token }}"
          export TARGET_REPO="${{ needs.detect-image.outputs.target_repo }}"
          export ISSUE_NUMBER="${{ needs.detect-image.outputs.issue_number }}"

          COMMENT_BODY=$(jq -r '.comment_body // empty' ../parsed_trigger.json 2>/dev/null || echo "${{ needs.detect-image.outputs.clean_prompt }}")
          PRIOR_CONTEXT=$(cat ../prior_summary.txt 2>/dev/null || echo "${{ steps.summary_context.outputs.summary }}")

          PROMPT="You are @the-intern-bot working on repository ${TARGET_REPO}, issue/PR #${ISSUE_NUMBER}.
          You have access to the GitHub CLI ('gh') and full git tools. Use 'gh' to post comments, inspect code, run tests, or open PRs as needed.

          "
          if [ -n "$PRIOR_CONTEXT" ]; then
            PROMPT="${PROMPT}Previous work summary on this issue/PR:
          $PRIOR_CONTEXT

          "
          fi
          PROMPT="${PROMPT}New request:
          $COMMENT_BODY"

          # Ensure dev user exists and owns all workspace directories so dev user has write access
          id -u dev >/dev/null 2>&1 || (useradd -m -s /bin/bash dev && echo '%sudo ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers)
          chown -R dev:dev . .. /__w /github/workspace /tmp /home/dev 2>/dev/null || true

          su dev -c "
            export CLAUDE_CODE_OAUTH_TOKEN=\"$CLAUDE_CODE_OAUTH_TOKEN\"
            export GH_TOKEN=\"$GH_TOKEN\"
            export GITHUB_TOKEN=\"$GITHUB_TOKEN\"
            export HOME=\"/home/dev\"
            cd \"$(pwd)\"
            git config --global --add safe.directory \"$(pwd)\" 2>/dev/null || true
            git config user.name \"the-intern-bot[bot]\"
            git config user.email \"the-intern-bot[bot]@users.noreply.github.com\"
            claude -p \"$PROMPT\" --output-format json --dangerously-skip-permissions > result.json 2>&1 || true
            jq -r '.result // .output // .' result.json > ../session_result.txt || true
          "

      - name: Commit session summary
        if: needs.detect-image.outputs.target_repo != '' && needs.detect-image.outputs.issue_number != ''
        run: node scripts/manage-summaries.js save
        env:
          TARGET_REPO: ${{ needs.detect-image.outputs.target_repo }}
          ISSUE_NUMBER: ${{ needs.detect-image.outputs.issue_number }}
          CLEAN_PROMPT: ${{ needs.detect-image.outputs.clean_prompt }}
          RESULT_FILE: session_result.txt
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
