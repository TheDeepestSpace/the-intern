name = "the-intern-bot-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AGENT_INFRA_OWNER = "TheDeepestSpace"
AGENT_INFRA_REPO = "the-intern"
# Which pushes/comments/messages run which agent is decided by agentic.yaml at
# the repo root, bundled into src/agentic.generated.js at deploy and test time
# (scripts/bundle-agentic.js) — no per-agent vars here.

[[kv_namespaces]]
binding = "CI_FAILURE_DEDUP"
id = "fcf245f1528e47f7a38215cc678977ba"

[triggers]
# Heartbeats usage-limit-poller.yml via repository_dispatch (poller_tick) —
# more reliable than GitHub Actions' own `schedule` trigger, which can lag
# under load (see #105). The GH-side schedule/workflow_dispatch triggers stay
# in place as a fallback.
crons = ["*/5 * * * *"]
