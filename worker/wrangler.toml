name = "the-intern-bot-relay"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AGENT_INFRA_OWNER = "TheDeepestSpace"
AGENT_INFRA_REPO = "the-intern"

# no-op change to trigger deploy-worker.yml after Node 22 fix (#27)

[[kv_namespaces]]
binding = "CI_FAILURE_DEDUP"
# PLACEHOLDER: run, once, from worker/ using the same Cloudflare account as
# CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID in .github/workflows/deploy-worker.yml:
#   npx wrangler kv namespace create CI_FAILURE_DEDUP
# then replace this id with the one it prints. Deploys will fail until this
# placeholder is replaced with a real namespace id.
id = "REPLACE_WITH_REAL_NAMESPACE_ID"